# Mosquitto config for local/dev use inside Docker.
#
# The eclipse-mosquitto image (v2.x) refuses ALL connections by default
# unless a listener and an authentication policy are explicitly set —
# without this file, sensor/backend containers would get "connection
# refused" even though the container is "running".

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout